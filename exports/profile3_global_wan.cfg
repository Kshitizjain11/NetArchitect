!
! ==============================================================================
!  NETARCHITECT AUTOMATED CISCO IOS PROVISIONING SPECIFICATION
! ==============================================================================
!  Target Profile       : global_wan
!  Description          : Profile 3: Global Distributed Enterprise WAN (4 Cities + Multi-Cloud VPC)
!  Link Distance        : 50000.0 meters (50.00 km)
!  Root Allocation CIDR : 10.100.0.0/16
!  Engineered Features  : IPsec VPN Tunnel Overlay (AES-256-GCM), Hierarchical Multi-Area OSPF + eBGP Peering, Autonomous System Boundary Isolation, CIDR Supernetting & Route Summarization
! ------------------------------------------------------------------------------
!  [L1 PHYSICAL MEDIA DECISION]
!  Selected Media       : OS2 SMF (10GBASE-LR/ER)
!  Standard Reference   : IEEE 802.3ae (10GBASE-LR/ER) / ITU-T G.652.D
!  Engineering Rationale:
!    Selected OS2 SMF (10GBASE-LR/ER) for 50000.0m (50.00km) link. Distance exceeds the 400m modal dispersion threshold of OM4 multi-mode fiber. Zero-water-peak OS2 Single-Mode Fiber (9/125 µm) operating at 1310nm/1550nm wavelength eliminates modal dispersion and provides the necessary optical link power budget for long-haul metropolitan or wide-area connectivity.
! ------------------------------------------------------------------------------
!  [L3 VLSM ADDRESS ALLOCATIONS]
!   VLAN 10   | Hub_Region_A             | CIDR: 10.100.0.0/22      | GW: 10.100.0.1      | Usable: 1022  | Eff: 58.7%
!   VLAN 20   | Hub_Region_B             | CIDR: 10.100.4.0/23      | GW: 10.100.4.1      | Usable: 510   | Eff: 98.0%
!   VLAN 30   | Hub_Region_C             | CIDR: 10.100.6.0/23      | GW: 10.100.6.1      | Usable: 510   | Eff: 88.2%
!   VLAN 40   | Branch_Region_D          | CIDR: 10.100.8.0/23      | GW: 10.100.8.1      | Usable: 510   | Eff: 58.8%
!   VLAN 50   | Cloud_VPC_Interconnect   | CIDR: 10.100.10.0/24     | GW: 10.100.10.1     | Usable: 254   | Eff: 59.1%
! ------------------------------------------------------------------------------
!  [L3 ROUTING ARCHITECTURE DECISION]
!  Selected Protocol    : Hierarchical Multi-Area OSPF + eBGP
!  Topology Scope       : Multi-Site Metro / Global WAN Hybrid Core
!  Engineering Rationale:
!    Selected Hierarchical Multi-Area OSPF + eBGP triggered by: multi-site/cloud boundary interconnection, multi-AS administrative segregation. Hierarchical OSPF segments the topology into Backbone Area 0 and edge stub/totally-stubby areas to contain Type-1 and Type-2 LSA flooding, localizing SPF recalculations during link flaps. External Border Gateway Protocol (eBGP) provides policy-driven inter-domain routing, AS-path loop prevention, and scalable peering across WAN transport and cloud VPC gateways.
! ==============================================================================
!

version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
service password-encryption
!
hostname GLOBAL_WAN-CORE-01
!
boot-start-marker
boot-end-marker
!
no ip domain-lookup
ip routing
ip cef
!
! --- LAYER 2 SPANNING TREE (RSTP) ---
spanning-tree mode rapid-pvst
spanning-tree portfast default
spanning-tree portfast bpduguard default
spanning-tree extend system-id
!
! --- 802.1Q VLAN DEFINITIONS ---
vlan 10
 name Hub_Region_A
 state active
!
vlan 20
 name Hub_Region_B
 state active
!
vlan 30
 name Hub_Region_C
 state active
!
vlan 40
 name Branch_Region_D
 state active
!
vlan 50
 name Cloud_VPC_Interconnect
 state active
!
! --- 802.1Q TRUNK UPLINK INTERFACE ---
interface TenGigabitEthernet0/1/1
 description Uplink Interconnect [OS2 SMF (10GBASE-LR/ER)] - global_wan
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,40,50
 switchport nonegotiate
 mtu 9000
 no shutdown
!
! --- ACCESS PORT TEMPLATES ---
interface GigabitEthernet1/0/1
 description Edge Access Port for Hub_Region_A [VLAN 10]
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
!
interface GigabitEthernet1/0/2
 description Edge Access Port for Hub_Region_B [VLAN 20]
 switchport mode access
 switchport access vlan 20
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
!
interface GigabitEthernet1/0/3
 description Edge Access Port for Hub_Region_C [VLAN 30]
 switchport mode access
 switchport access vlan 30
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
!
interface GigabitEthernet1/0/4
 description Edge Access Port for Branch_Region_D [VLAN 40]
 switchport mode access
 switchport access vlan 40
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
!
interface GigabitEthernet1/0/5
 description Edge Access Port for Cloud_VPC_Interconnect [VLAN 50]
 switchport mode access
 switchport access vlan 50
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
!
! --- LAYER 3 SWITCH VIRTUAL INTERFACES (SVIs) ---
interface Vlan10
 description SVI Gateway for Hub_Region_A [10.100.0.0/22]
 ip address 10.100.0.1 255.255.252.0
 no ip redirects
 no ip unreachables
 no shutdown
!
interface Vlan20
 description SVI Gateway for Hub_Region_B [10.100.4.0/23]
 ip address 10.100.4.1 255.255.254.0
 no ip redirects
 no ip unreachables
 no shutdown
!
interface Vlan30
 description SVI Gateway for Hub_Region_C [10.100.6.0/23]
 ip address 10.100.6.1 255.255.254.0
 no ip redirects
 no ip unreachables
 no shutdown
!
interface Vlan40
 description SVI Gateway for Branch_Region_D [10.100.8.0/23]
 ip address 10.100.8.1 255.255.254.0
 no ip redirects
 no ip unreachables
 no shutdown
!
interface Vlan50
 description SVI Gateway for Cloud_VPC_Interconnect [10.100.10.0/24]
 ip address 10.100.10.1 255.255.255.0
 no ip redirects
 no ip unreachables
 no shutdown
!
! --- IPSEC VPN TUNNEL OVERLAY SPECIFICATION ---
crypto isakmp policy 10
 encr aes 256
 authentication pre-share
 group 14
 lifetime 86400
!
crypto isakmp key CiscoEnterpriseIPsecSecret100! address 198.51.100.2
!
crypto ipsec transform-set TS_AES256_SHA256 esp-aes 256 esp-sha256-hmac
 mode tunnel
!
crypto map WAN_CRYPTO_MAP 10 ipsec-isakmp
 set peer 198.51.100.2
 set transform-set TS_AES256_SHA256
 match address ACL_IPSEC_INTERCONNECT
!
interface Tunnel100
 description IPsec VTI to Multi-Cloud VPC Transit Gateway
 ip address 172.31.255.1 255.255.255.252
 tunnel source TenGigabitEthernet0/1/1
 tunnel destination 198.51.100.2
 tunnel mode ipsec ipv4
 tunnel protection ipsec profile IPSEC_PROFILE_WAN
 no shutdown
!
! --- L3 ROUTING: HIERARCHICAL MULTI-AREA OSPF ---
router ospf 1
 router-id 10.255.255.1
 log-adjacency-changes detail
 auto-cost reference-bandwidth 100000
 passive-interface default
 no passive-interface Vlan10
 no passive-interface Vlan20
 no passive-interface Vlan30
 no passive-interface Vlan40
 no passive-interface Vlan50
 no passive-interface TenGigabitEthernet0/1/1
 area 10 range 10.100.0.0 255.255.0.0
 network 10.100.0.0 0.0.3.255 area 0
 network 10.100.4.0 0.0.1.255 area 0
 network 10.100.6.0 0.0.1.255 area 10
 network 10.100.8.0 0.0.1.255 area 10
 network 10.100.10.0 0.0.0.255 area 10
!
! --- L3 ROUTING: BGP INTER-DOMAIN PEERING ---
router bgp 65001
 bgp router-id 10.255.255.1
 bgp log-neighbor-changes
 neighbor 198.51.100.2 remote-as 65500
 neighbor 198.51.100.2 description Transit_Cloud_Boundary
 !
 address-family ipv4
  network 10.100.0.0 mask 255.255.0.0
  neighbor 198.51.100.2 activate
  neighbor 198.51.100.2 next-hop-self
 exit-address-family
!
! --- SECURITY ACCESS CONTROL LISTS (ACLs) ---
ip access-list standard ACL_PERMIT_INTERNAL_SUBNETS
 remark Deterministic ACL: Permit all algorithmically allocated subnets
 permit 10.100.0.0 0.0.3.255 log  ! Hub_Region_A [VLAN 10]
 permit 10.100.4.0 0.0.1.255 log  ! Hub_Region_B [VLAN 20]
 permit 10.100.6.0 0.0.1.255 log  ! Hub_Region_C [VLAN 30]
 permit 10.100.8.0 0.0.1.255 log  ! Branch_Region_D [VLAN 40]
 permit 10.100.10.0 0.0.0.255 log  ! Cloud_VPC_Interconnect [VLAN 50]
 deny any log
!
ip access-list extended ACL_IPSEC_INTERCONNECT
 remark Permit IPsec overlay between enterprise root and remote VPC
 permit ip 10.100.0.0 0.0.255.255 10.200.0.0 0.0.255.255
 deny ip any any log
!
line con 0
 exec-timeout 15 0
 logging synchronous
line vty 0 4
 access-class ACL_PERMIT_INTERNAL_SUBNETS in
 exec-timeout 15 0
 transport input ssh
 logging synchronous
!
end