!
! ==============================================================================
!  NETARCHITECT AUTOMATED CISCO IOS PROVISIONING SPECIFICATION
! ==============================================================================
!  Target Profile       : metro_man
!  Description          : Profile 2: Low-Latency Financial Metro Area Network (HQ + 2 Remote Colos)
!  Link Distance        : 22000.0 meters (22.00 km)
!  Root Allocation CIDR : 172.16.0.0/16
!  Engineered Features  : Ethernet Virtual Private Line (EVPL), Sub-5ms Strict Priority Queuing (QoS), Dual-Homed Default Gateway Redundancy (HSRP), Multi-Site OSPF Core Peering
! ------------------------------------------------------------------------------
!  [L1 PHYSICAL MEDIA DECISION]
!  Selected Media       : OS2 SMF (10GBASE-LR/ER)
!  Standard Reference   : IEEE 802.3ae (10GBASE-LR/ER) / ITU-T G.652.D
!  Engineering Rationale:
!    Selected OS2 SMF (10GBASE-LR/ER) for 22000.0m (22.00km) link. Distance exceeds the 400m modal dispersion threshold of OM4 multi-mode fiber. Zero-water-peak OS2 Single-Mode Fiber (9/125 µm) operating at 1310nm/1550nm wavelength eliminates modal dispersion and provides the necessary optical link power budget for long-haul metropolitan or wide-area connectivity.
! ------------------------------------------------------------------------------
!  [L3 VLSM ADDRESS ALLOCATIONS]
!   VLAN 100  | HQ_TradingFloor          | CIDR: 172.16.0.0/24      | GW: 172.16.0.1      | Usable: 254   | Eff: 78.7%
!   VLAN 200  | Colo1_UltraLowLatency    | CIDR: 172.16.1.0/24      | GW: 172.16.1.1      | Usable: 254   | Eff: 59.1%
!   VLAN 300  | Colo2_DisasterRecovery   | CIDR: 172.16.2.0/25      | GW: 172.16.2.1      | Usable: 126   | Eff: 79.4%
! ------------------------------------------------------------------------------
!  [L3 ROUTING ARCHITECTURE DECISION]
!  Selected Protocol    : Hierarchical Multi-Area OSPF + eBGP
!  Topology Scope       : Multi-Site Metro / Global WAN Hybrid Core
!  Engineering Rationale:
!    Selected Hierarchical Multi-Area OSPF + eBGP triggered by: multi-site/cloud boundary interconnection, multi-AS administrative segregation. Hierarchical OSPF segments the topology into Backbone Area 0 and edge stub/totally-stubby areas to contain Type-1 and Type-2 LSA flooding, localizing SPF recalculations during link flaps. External Border Gateway Protocol (eBGP) provides policy-driven inter-domain routing, AS-path loop prevention, and scalable peering across WAN transport and cloud VPC gateways.
! ==============================================================================
!

version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
service password-encryption
!
hostname METRO_MAN-CORE-01
!
boot-start-marker
boot-end-marker
!
no ip domain-lookup
ip routing
ip cef
!
! --- LAYER 2 SPANNING TREE (RSTP) ---
spanning-tree mode rapid-pvst
spanning-tree portfast default
spanning-tree portfast bpduguard default
spanning-tree extend system-id
!
! --- 802.1Q VLAN DEFINITIONS ---
vlan 100
 name HQ_TradingFloor
 state active
!
vlan 200
 name Colo1_UltraLowLatency
 state active
!
vlan 300
 name Colo2_DisasterRecovery
 state active
!
! --- 802.1Q TRUNK UPLINK INTERFACE ---
interface TenGigabitEthernet0/1/1
 description Uplink Interconnect [OS2 SMF (10GBASE-LR/ER)] - metro_man
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 100,200,300
 switchport nonegotiate
 mtu 9000
 no shutdown
!
! --- ACCESS PORT TEMPLATES ---
interface GigabitEthernet1/0/1
 description Edge Access Port for HQ_TradingFloor [VLAN 100]
 switchport mode access
 switchport access vlan 100
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
!
interface GigabitEthernet1/0/2
 description Edge Access Port for Colo1_UltraLowLatency [VLAN 200]
 switchport mode access
 switchport access vlan 200
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
!
interface GigabitEthernet1/0/3
 description Edge Access Port for Colo2_DisasterRecovery [VLAN 300]
 switchport mode access
 switchport access vlan 300
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
!
! --- LAYER 3 SWITCH VIRTUAL INTERFACES (SVIs) ---
interface Vlan100
 description SVI Gateway for HQ_TradingFloor [172.16.0.0/24]
 ip address 172.16.0.2 255.255.255.0
 standby 100 ip 172.16.0.1
 standby 100 priority 110
 standby 100 preempt
 standby 100 authentication md5 key-string FinTechHSRP99
 no ip redirects
 no ip unreachables
 no shutdown
!
interface Vlan200
 description SVI Gateway for Colo1_UltraLowLatency [172.16.1.0/24]
 ip address 172.16.1.2 255.255.255.0
 standby 200 ip 172.16.1.1
 standby 200 priority 110
 standby 200 preempt
 standby 200 authentication md5 key-string FinTechHSRP99
 no ip redirects
 no ip unreachables
 no shutdown
!
interface Vlan300
 description SVI Gateway for Colo2_DisasterRecovery [172.16.2.0/25]
 ip address 172.16.2.2 255.255.255.128
 standby 300 ip 172.16.2.1
 standby 300 priority 110
 standby 300 preempt
 standby 300 authentication md5 key-string FinTechHSRP99
 no ip redirects
 no ip unreachables
 no shutdown
!
! --- METRO QoS SUB-5MS STRICT PRIORITY POLICY ---
class-map match-any CRITICAL_TRADING_VOICE
 match ip dscp ef
 match ip precedence 5
!
class-map match-any INTERACTIVE_VIDEO
 match ip dscp af41
 match ip dscp af42
!
policy-map POLICY_SUB5MS_CORE
 class CRITICAL_TRADING_VOICE
  priority percent 35
 class INTERACTIVE_VIDEO
  bandwidth remaining percent 25
 class class-default
  fair-queue
  random-detect dscp-based
!
interface TenGigabitEthernet0/1/1
 service-policy output POLICY_SUB5MS_CORE
!
! --- L3 ROUTING: HIERARCHICAL MULTI-AREA OSPF ---
router ospf 1
 router-id 10.255.255.1
 log-adjacency-changes detail
 auto-cost reference-bandwidth 100000
 passive-interface default
 no passive-interface Vlan100
 no passive-interface Vlan200
 no passive-interface Vlan300
 no passive-interface TenGigabitEthernet0/1/1
 network 172.16.0.0 0.0.0.255 area 0
 network 172.16.1.0 0.0.0.255 area 0
 network 172.16.2.0 0.0.0.127 area 10
!
! --- L3 ROUTING: BGP INTER-DOMAIN PEERING ---
router bgp 65001
 bgp router-id 10.255.255.1
 bgp log-neighbor-changes
 neighbor 198.51.100.2 remote-as 65500
 neighbor 198.51.100.2 description Transit_Cloud_Boundary
 !
 address-family ipv4
  network 172.16.0.0 mask 255.255.0.0
  neighbor 198.51.100.2 activate
  neighbor 198.51.100.2 next-hop-self
 exit-address-family
!
! --- SECURITY ACCESS CONTROL LISTS (ACLs) ---
ip access-list standard ACL_PERMIT_INTERNAL_SUBNETS
 remark Deterministic ACL: Permit all algorithmically allocated subnets
 permit 172.16.0.0 0.0.0.255 log  ! HQ_TradingFloor [VLAN 100]
 permit 172.16.1.0 0.0.0.255 log  ! Colo1_UltraLowLatency [VLAN 200]
 permit 172.16.2.0 0.0.0.127 log  ! Colo2_DisasterRecovery [VLAN 300]
 deny any log
!
line con 0
 exec-timeout 15 0
 logging synchronous
line vty 0 4
 access-class ACL_PERMIT_INTERNAL_SUBNETS in
 exec-timeout 15 0
 transport input ssh
 logging synchronous
!
end