!
! ==============================================================================
!  NETARCHITECT AUTOMATED CISCO IOS PROVISIONING SPECIFICATION
! ==============================================================================
!  Target Profile       : campus_lan
!  Description          : Profile 1: High-Density 3-Building Enterprise Campus LAN
!  Link Distance        : 300.0 meters (0.30 km)
!  Root Allocation CIDR : 10.10.0.0/16
!  Engineered Features  : PoE 802.3bt Access Layer, 802.1Q VLAN Trunking, Rapid Per-VLAN Spanning Tree (PVRST+), Single-Area OSPFv2 (Area 0)
! ------------------------------------------------------------------------------
!  [L1 PHYSICAL MEDIA DECISION]
!  Selected Media       : OM4 MMF (10GBASE-SR)
!  Standard Reference   : IEEE 802.3ae (10GBASE-SR) / TIA-492AAAD
!  Engineering Rationale:
!    Selected OM4 MMF (10GBASE-SR) for 300.0m link. Link distance exceeds IEEE 802.3an copper threshold (100m). Laser-optimized 50/125 µm multi-mode fiber (OM4) operating at 850nm VCSEL wavelength safely supports 10 Gbps transmission up to 400m before differential modal dispersion (DMD) induces bit error rate (BER) penalties.
! ------------------------------------------------------------------------------
!  [L3 VLSM ADDRESS ALLOCATIONS]
!   VLAN 10   | BldgA_Engineering        | CIDR: 10.10.0.0/22       | GW: 10.10.0.1       | Usable: 1022  | Eff: 78.3%
!   VLAN 20   | BldgB_Operations         | CIDR: 10.10.4.0/23       | GW: 10.10.4.1       | Usable: 510   | Eff: 78.4%
!   VLAN 30   | BldgC_Administration     | CIDR: 10.10.6.0/24       | GW: 10.10.6.1       | Usable: 254   | Eff: 98.4%
!   VLAN 40   | Campus_VoIP_WLAN         | CIDR: 10.10.7.0/24       | GW: 10.10.7.1       | Usable: 254   | Eff: 59.1%
! ------------------------------------------------------------------------------
!  [L3 ROUTING ARCHITECTURE DECISION]
!  Selected Protocol    : Single-Area OSPFv2 (Area 0)
!  Topology Scope       : Enterprise Campus Interior Gateway (IGP)
!  Engineering Rationale:
!    Selected Single-Area OSPFv2 (Area 0) for topology of 4 subnets within a single AS. Single-Area OSPF executes Dijkstra's Shortest Path First (SPF) algorithm natively across all nodes in Backbone Area 0. With fewer than 50 subnets, link-state database (LSDB) flooding overhead is negligible, eliminating the need for inter-area route summarization (ABRs) and providing sub-second link-state convergence with minimal router memory footprint.
! ==============================================================================
!

version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
service password-encryption
!
hostname CAMPUS_LAN-CORE-01
!
boot-start-marker
boot-end-marker
!
no ip domain-lookup
ip routing
ip cef
!
! --- LAYER 2 SPANNING TREE (RSTP) ---
spanning-tree mode rapid-pvst
spanning-tree portfast default
spanning-tree portfast bpduguard default
spanning-tree extend system-id
!
! --- 802.1Q VLAN DEFINITIONS ---
vlan 10
 name BldgA_Engineering
 state active
!
vlan 20
 name BldgB_Operations
 state active
!
vlan 30
 name BldgC_Administration
 state active
!
vlan 40
 name Campus_VoIP_WLAN
 state active
!
! --- 802.1Q TRUNK UPLINK INTERFACE ---
interface TenGigabitEthernet0/1/1
 description Uplink Interconnect [OM4 MMF (10GBASE-SR)] - campus_lan
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,40
 switchport nonegotiate
 mtu 9000
 no shutdown
!
! --- ACCESS PORT TEMPLATES ---
interface GigabitEthernet1/0/1
 description Edge Access Port for BldgA_Engineering [VLAN 10]
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
!
interface GigabitEthernet1/0/2
 description Edge Access Port for BldgB_Operations [VLAN 20]
 switchport mode access
 switchport access vlan 20
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
!
interface GigabitEthernet1/0/3
 description Edge Access Port for BldgC_Administration [VLAN 30]
 switchport mode access
 switchport access vlan 30
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
!
interface GigabitEthernet1/0/4
 description Edge Access Port for Campus_VoIP_WLAN [VLAN 40]
 switchport mode access
 switchport access vlan 40
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
!
! --- LAYER 3 SWITCH VIRTUAL INTERFACES (SVIs) ---
interface Vlan10
 description SVI Gateway for BldgA_Engineering [10.10.0.0/22]
 ip address 10.10.0.1 255.255.252.0
 no ip redirects
 no ip unreachables
 no shutdown
!
interface Vlan20
 description SVI Gateway for BldgB_Operations [10.10.4.0/23]
 ip address 10.10.4.1 255.255.254.0
 no ip redirects
 no ip unreachables
 no shutdown
!
interface Vlan30
 description SVI Gateway for BldgC_Administration [10.10.6.0/24]
 ip address 10.10.6.1 255.255.255.0
 no ip redirects
 no ip unreachables
 no shutdown
!
interface Vlan40
 description SVI Gateway for Campus_VoIP_WLAN [10.10.7.0/24]
 ip address 10.10.7.1 255.255.255.0
 no ip redirects
 no ip unreachables
 no shutdown
!
! --- L3 ROUTING: SINGLE-AREA OSPFv2 (AREA 0) ---
router ospf 1
 router-id 1.1.1.1
 log-adjacency-changes detail
 auto-cost reference-bandwidth 100000
 passive-interface default
 no passive-interface Vlan10
 no passive-interface Vlan20
 no passive-interface Vlan30
 no passive-interface Vlan40
 no passive-interface TenGigabitEthernet0/1/1
 network 10.10.0.0 0.0.3.255 area 0
 network 10.10.4.0 0.0.1.255 area 0
 network 10.10.6.0 0.0.0.255 area 0
 network 10.10.7.0 0.0.0.255 area 0
!
! --- SECURITY ACCESS CONTROL LISTS (ACLs) ---
ip access-list standard ACL_PERMIT_INTERNAL_SUBNETS
 remark Deterministic ACL: Permit all algorithmically allocated subnets
 permit 10.10.0.0 0.0.3.255 log  ! BldgA_Engineering [VLAN 10]
 permit 10.10.4.0 0.0.1.255 log  ! BldgB_Operations [VLAN 20]
 permit 10.10.6.0 0.0.0.255 log  ! BldgC_Administration [VLAN 30]
 permit 10.10.7.0 0.0.0.255 log  ! Campus_VoIP_WLAN [VLAN 40]
 deny any log
!
line con 0
 exec-timeout 15 0
 logging synchronous
line vty 0 4
 access-class ACL_PERMIT_INTERNAL_SUBNETS in
 exec-timeout 15 0
 transport input ssh
 logging synchronous
!
end