!
! ==============================================================================
!  NETARCHITECT AUTOMATED CISCO IOS PROVISIONING SPECIFICATION
! ==============================================================================
!  Target Profile       : custom_edge_datacenter
!  Description          : Custom Edge Computing Facility with Local IoT & AI Inference
!  Link Distance        : 75.0 meters (0.07 km)
!  Root Allocation CIDR : 192.168.10.0/24
!  Engineered Features  : 802.1Q VLAN Trunking, Rapid PVST+, Single-Area OSPFv2
! ------------------------------------------------------------------------------
!  [L1 PHYSICAL MEDIA DECISION]
!  Selected Media       : Cat6a (10GBASE-T)
!  Standard Reference   : IEEE 802.3an (10GBASE-T)
!  Engineering Rationale:
!    Selected Cat6a (10GBASE-T) for 75.0m link. Complies with IEEE 802.3an standards for 10 Gigabit Ethernet over balanced 4-pair shielded/unshielded twisted pair cabling up to the 100-meter channel attenuation limit. Provides cost-effective, standard RJ-45 interconnectivity with minimal transceiver overhead.
! ------------------------------------------------------------------------------
!  [L3 VLSM ADDRESS ALLOCATIONS]
!   VLAN 110  | Inference_Cluster        | CIDR: 192.168.10.0/25    | GW: 192.168.10.1    | Usable: 126   | Eff: 79.4%
!   VLAN 120  | Edge_Sensors             | CIDR: 192.168.10.128/26  | GW: 192.168.10.129  | Usable: 62    | Eff: 80.7%
!   VLAN 130  | OOB_Management           | CIDR: 192.168.10.192/27  | GW: 192.168.10.193  | Usable: 30    | Eff: 66.7%
! ------------------------------------------------------------------------------
!  [L3 ROUTING ARCHITECTURE DECISION]
!  Selected Protocol    : Single-Area OSPFv2 (Area 0)
!  Topology Scope       : Enterprise Campus Interior Gateway (IGP)
!  Engineering Rationale:
!    Selected Single-Area OSPFv2 (Area 0) for topology of 3 subnets within a single AS. Single-Area OSPF executes Dijkstra's Shortest Path First (SPF) algorithm natively across all nodes in Backbone Area 0. With fewer than 50 subnets, link-state database (LSDB) flooding overhead is negligible, eliminating the need for inter-area route summarization (ABRs) and providing sub-second link-state convergence with minimal router memory footprint.
! ==============================================================================
!

version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
service password-encryption
!
hostname CUSTOM_EDGE_DATACENTER-CORE-01
!
boot-start-marker
boot-end-marker
!
no ip domain-lookup
ip routing
ip cef
!
! --- LAYER 2 SPANNING TREE (RSTP) ---
spanning-tree mode rapid-pvst
spanning-tree portfast default
spanning-tree portfast bpduguard default
spanning-tree extend system-id
!
! --- 802.1Q VLAN DEFINITIONS ---
vlan 110
 name Inference_Cluster
 state active
!
vlan 120
 name Edge_Sensors
 state active
!
vlan 130
 name OOB_Management
 state active
!
! --- 802.1Q TRUNK UPLINK INTERFACE ---
interface TenGigabitEthernet0/1/1
 description Uplink Interconnect [Cat6a (10GBASE-T)] - custom_edge_datacenter
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 110,120,130
 switchport nonegotiate
 mtu 9000
 no shutdown
!
! --- ACCESS PORT TEMPLATES ---
interface GigabitEthernet1/0/1
 description Edge Access Port for Inference_Cluster [VLAN 110]
 switchport mode access
 switchport access vlan 110
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
!
interface GigabitEthernet1/0/2
 description Edge Access Port for Edge_Sensors [VLAN 120]
 switchport mode access
 switchport access vlan 120
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
!
interface GigabitEthernet1/0/3
 description Edge Access Port for OOB_Management [VLAN 130]
 switchport mode access
 switchport access vlan 130
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
!
! --- LAYER 3 SWITCH VIRTUAL INTERFACES (SVIs) ---
interface Vlan110
 description SVI Gateway for Inference_Cluster [192.168.10.0/25]
 ip address 192.168.10.1 255.255.255.128
 no ip redirects
 no ip unreachables
 no shutdown
!
interface Vlan120
 description SVI Gateway for Edge_Sensors [192.168.10.128/26]
 ip address 192.168.10.129 255.255.255.192
 no ip redirects
 no ip unreachables
 no shutdown
!
interface Vlan130
 description SVI Gateway for OOB_Management [192.168.10.192/27]
 ip address 192.168.10.193 255.255.255.224
 no ip redirects
 no ip unreachables
 no shutdown
!
! --- L3 ROUTING: SINGLE-AREA OSPFv2 (AREA 0) ---
router ospf 1
 router-id 1.1.1.1
 log-adjacency-changes detail
 auto-cost reference-bandwidth 100000
 passive-interface default
 no passive-interface Vlan110
 no passive-interface Vlan120
 no passive-interface Vlan130
 no passive-interface TenGigabitEthernet0/1/1
 network 192.168.10.0 0.0.0.127 area 0
 network 192.168.10.128 0.0.0.63 area 0
 network 192.168.10.192 0.0.0.31 area 0
!
! --- SECURITY ACCESS CONTROL LISTS (ACLs) ---
ip access-list standard ACL_PERMIT_INTERNAL_SUBNETS
 remark Deterministic ACL: Permit all algorithmically allocated subnets
 permit 192.168.10.0 0.0.0.127 log  ! Inference_Cluster [VLAN 110]
 permit 192.168.10.128 0.0.0.63 log  ! Edge_Sensors [VLAN 120]
 permit 192.168.10.192 0.0.0.31 log  ! OOB_Management [VLAN 130]
 deny any log
!
line con 0
 exec-timeout 15 0
 logging synchronous
line vty 0 4
 access-class ACL_PERMIT_INTERNAL_SUBNETS in
 exec-timeout 15 0
 transport input ssh
 logging synchronous
!
end